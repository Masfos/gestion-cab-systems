{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-4 p-md-5">
                <h3 class="text-center text-info mb-4 fw-bold">Nuevo Trabajador</h3>
                <hr class="border-secondary mb-4">

                {% if error %}
                    <div class="alert alert-danger py-2 small">⚠️ {{ error }}</div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-2 d-block">NOMBRE DE USUARIO</label>
                        <input type="text" name="username" class="form-control" placeholder="Ej: j.perez" required>
                    </div>

                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-2 d-block">CONTRASEÑA PROVISIONAL</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="text-secondary small fw-bold mb-2 d-block">ROL EN EL TALLER</label>
                        <select name="grupo" class="form-select" required>
                            <option value="" disabled selected>Seleccione cargo...</option>
                            {% for grupo in grupos %}
                                <option value="{{ grupo.id }}">{{ grupo.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-info btn-lg fw-bold text-dark">CREAR ACCESO</button>
                        <a href="{% url 'lista_usuarios' %}" class="btn btn-link text-secondary">Volver a la lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
