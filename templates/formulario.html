{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg" style="background-color: #4a4850; border: 1px solid #5a5860; border-radius: 15px; color: white;">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 fw-bold text-info">{{ titulo }}</h2>
                <hr class="border-secondary mb-4">

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <style>
                        /* Forzamos el estilo aquí para que ignore archivos CSS viejos */
                        input, select, textarea {
                            display: block;
                            width: 100%;
                            padding: 12px;
                            margin-bottom: 20px !important;
                            background-color: #5a5860 !important;
                            border: 1px solid #6a6870 !important;
                            color: white !important;
                            border-radius: 10px;
                        }
                        label { 
                            font-weight: bold; 
                            margin-bottom: 8px; 
                            display: block; 
                            color: #0dcaf0; /* Cyan profesional */
                            text-transform: uppercase;
                            font-size: 0.8rem;
                        }
                        .form-control:focus {
                            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25) !important;
                        }
                    </style>

                    {% for field in form %}
                        <div class="field-container">
                            <label>{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-info btn-lg fw-bold text-dark">GUARDAR REGISTRO</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-light">Cancelar y Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
