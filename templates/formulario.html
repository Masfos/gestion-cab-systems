{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0" style="background-color: #2c2f33; border-radius: 20px; color: white;">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 fw-bold text-info" style="letter-spacing: 1px;">{{ titulo }}</h2>
                <hr class="border-secondary mb-4">

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <style>
                        label { 
                            font-weight: 600; 
                            margin-bottom: 10px; 
                            display: block; 
                            color: #0dcaf0;
                            font-size: 0.9rem;
                            text-transform: uppercase;
                        }
                        select option { background: #212529; color: white; }
                        .form-control:focus {
                            background-color: #3e4146 !important;
                            border-color: #0dcaf0 !important;
                            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25);
                            color: white;
                        }
                        .preview-img {
                            width: 80px; height: 80px;
                            object-fit: cover;
                            border-radius: 8px;
                            border: 1px solid #5a5860;
                        }
                    </style>

                    {% for field in form %}
                        <div class="mb-4">
                            <label>{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    {% if titulo == "Nueva Orden" or titulo == "Editar Orden" %}
                    <div class="mb-4">
                        <label>Fotos adjuntas</label>
                        <input type="file" name="fotos" multiple accept="image/*"
                            class="form-control bg-dark text-white border-secondary"
                            style="border-radius: 10px; padding: 12px;"
                            id="inputFotos">
                        <div id="preview" class="d-flex flex-wrap gap-2 mt-3"></div>
                    </div>
                    {% endif %}

                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-info btn-lg fw-bold text-dark shadow">
                            <i class="bi bi-save me-2"></i>GUARDAR REGISTRO
                        </button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary border-0">Cancelar y Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('inputFotos')?.addEventListener('change', function () {
    const preview = document.getElementById('preview');
    preview.innerHTML = '';
    Array.from(this.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = document.createElement('img');
            img.src = e.target.result;
            img.classList.add('preview-img');
            preview.appendChild(img);
        };
        reader.readAsDataURL(file);
    });
});
</script>
{% endblock %}
