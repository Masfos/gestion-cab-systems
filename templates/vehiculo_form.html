{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-lg">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center text-info mb-4 fw-bold">Gestión de Vehículo</h2>
                <hr class="border-secondary mb-4">

                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">
                                {% if field.label == "Anio" %}AÑO{% else %}{{ field.label|upper }}{% endif %}
                            </label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">GUARDAR VEHÍCULO</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
