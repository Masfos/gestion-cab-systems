{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-lg">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center text-info mb-4 fw-bold">Editar Orden #{{ orden.id }}</h2>
                <hr class="border-secondary mb-4">

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="text-secondary small fw-bold mb-2 d-block">{{ field.label|upper }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}

                    <div class="mt-4 p-3 rounded bg-dark border border-secondary border-dashed text-center">
                        <label class="text-info fw-bold d-block mb-2">📸 AÑADIR NUEVAS FOTOS</label>
                        <input type="file" name="fotos_adicionales" multiple class="form-control" accept="image/*">
                        <div id="preview-container" class="d-flex flex-wrap justify-content-center mt-3 gap-2"></div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">GUARDAR CAMBIOS</button>
                        <a href="{% url 'ver_orden' orden.id %}" class="btn btn-outline-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelector('input[name="fotos_adicionales"]').addEventListener('change', function() {
        const container = document.getElementById('preview-container');
        container.innerHTML = '';
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.cssText = "width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #555;";
                container.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    });
</script>
{% endblock %}
