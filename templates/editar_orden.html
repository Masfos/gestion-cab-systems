{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-lg" style="background-color: #4a4850; border: 1px solid #5a5860; color: white;">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 fw-bold">Editar Orden #{{ orden.id }}</h2>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label text-info">Vehículo</label>
                        {{ form.vehiculo }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-info">Descripción</label>
                        {{ form.descripcion }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-info">Estado</label>
                        {{ form.estado }}
                    </div>
                    <div class="mb-4 p-3 rounded" style="background: #39373d; border: 1px dashed #6a6870;">
                        <label class="form-label text-warning fw-bold">📸 Añadir Imágenes (Multiselección)</label>
                        {{ form.imagenes }}
                        <div id="preview" class="d-flex flex-wrap mt-2"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">GUARDAR CAMBIOS</button>
                        <a href="{% url 'ver_orden' orden.id %}" class="btn btn-outline-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelector('input[type="file"]').addEventListener('change', function() {
        const preview = document.getElementById('preview');
        preview.innerHTML = '';
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.width = '70px';
                img.style.margin = '5px';
                img.classList.add('rounded', 'border');
                preview.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    });
</script>
{% endblock %}
