{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-info">Inventario de Materiales</h2>
    <a href="{% url 'agregar_material' %}" class="btn btn-success fw-bold">➕ Registrar Nuevo Material</a>
</div>

<div class="card bg-dark-custom p-3 border-secondary">
    <form method="GET" class="mb-0">
        <input type="text" name="q" class="form-control bg-dark text-white border-secondary" placeholder="Buscar material..." value="{{ request.GET.q }}">
    </form>
</div>

<div class="table-responsive mt-4">
    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th><th>Descripción</th><th>Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for m in materiales %}
            <tr>
                <td class="fw-bold text-info">{{ m.nombre }}</td>
                <td>{{ m.descripcion }}</td>
                <td><span class="badge bg-secondary px-3">{{ m.stock }}</span></td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-center py-4">No hay materiales en el sistema.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
