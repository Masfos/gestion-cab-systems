{% extends "base.html" %}
{% block content %}
<div class="card shadow-lg">
    <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-info m-0">Stock de Materiales</h2>
            <a href="{% url 'agregar_material' %}" class="btn btn-primary btn-sm">+ Agregar</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="text-secondary small">
                    <tr><th>MATERIAL</th><th class="text-center">STOCK</th></tr>
                </thead>
                <tbody>
                    {% for m in materiales %}
                    <tr>
                        <td class="fw-bold">{{ m.nombre }}</td>
                        <td class="text-center">
                            <span class="badge {% if m.stock < 5 %}bg-danger{% else %}bg-success{% endif %} fs-6 px-3">
                                {{ m.stock }} uds
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
