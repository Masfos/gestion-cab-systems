{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor-Tech | Gestión de Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #121212; --card-dark: #1e1e1e; --accent: #0dcaf0; }
        body { background-color: var(--bg-dark); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #000; border-bottom: 1px solid #333; }
        .card { background-color: var(--card-dark); border: 1px solid #333; border-radius: 12px; }
        .form-control, .form-select { background-color: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 8px; }
        .form-control:focus { background-color: #333; color: #fff; border-color: var(--accent); box-shadow: none; }
        .table { --bs-table-bg: transparent; color: #e0e0e0; border-color: #333; }
        .btn-primary { background-color: #0056b3; border: none; }
        .text-info { color: var(--accent) !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="{% url 'dashboard' %}">MOTOR-TECH</a>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary small d-none d-md-block">Sesión: <strong>{{ user.username }}</strong></span>
                <form action="{% url 'logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">Salir</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
