{% extends "base.html" %}
{% block content %}

<h2>Órdenes de Trabajo</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Vehículo</th>
            <th>Estado</th>
        </tr>
    </thead>
    <tbody>
        {% for orden in ordenes %}
        <tr>
            <td>{{ orden.id }}</td>
            <td>{{ orden.cliente.nombre }}</td>
            <td>{{ orden.vehiculo.modelo }}</td>
            <td>{{ orden.estado }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{% url 'dashboard' %}" class="btn btn-secondary">Volver</a>

{% endblock %}
