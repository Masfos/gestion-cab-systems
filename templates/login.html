{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso CAB Systems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #39373d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background-color: #4a4850;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px; /* Asegura que se vea bien en móviles */
            color: white;
            text-align: center;
            border: 1px solid #5a5860;
        }

        .logo-login {
            width: 160px; /* Un poco más grande para que destaque */
            height: auto;
            margin-bottom: 20px;
        }

        /* Forzamos que los inputs de Django se vean como Bootstrap */
        input[type="text"], input[type="password"] {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: white;
            background-color: #5a5860;
            background-clip: padding-box;
            border: 1px solid #6a6870;
            border-radius: 0.375rem;
            transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        }

        input:focus {
            background-color: #5a5860 !important;
            color: white !important;
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            background-color: #0d6efd;
            width: 100%;
            border: none;
            padding: 12px;
            font-weight: bold;
            margin-top: 10px;
            border-radius: 8px;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
        }

        .error-box {
            background-color: #dc3545;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <img src="{% static 'img/logo.png' %}" alt="Logo CAB" class="logo-login">
        <h2 class="h4 mb-4 fw-bold">Gestión CAB Systems</h2>

        {% if form.errors %}
            <div class="error-box">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3 text-start">
                <label class="form-label small text-secondary">Nombre de Usuario</label>
                {{ form.username }}
            </div>

            <div class="mb-4 text-start">
                <label class="form-label small text-secondary">Contraseña</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-login btn-primary shadow">
                INGRESAR
            </button>
        </form>
    </div>
</body>
</html>
