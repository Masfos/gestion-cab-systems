{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Motor-Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background-color: #1e1e1e; border: 1px solid #333; width: 100%; max-width: 400px; border-radius: 15px; }
        .form-control { background-color: #2c2c2c; border: 1px solid #444; color: #fff; }
        .form-control:focus { background-color: #333; color: #fff; border-color: #0dcaf0; box-shadow: none; }
    </style>
</head>
<body>
    <div class="card shadow-lg p-4">
        <div class="text-center mb-4">
            <h2 class="text-info fw-bold">MOTOR-TECH</h2>
            <p class="text-secondary small">Gestión Interna de Taller</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small text-center">Usuario o clave incorrectos</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">USUARIO</label>
                <input type="text" name="username" class="form-control form-control-lg" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">CONTRASEÑA</label>
                <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">ENTRAR</button>
        </form>
    </div>
</body>
</html>
