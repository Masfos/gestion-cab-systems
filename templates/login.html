{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso CAB Systems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #39373d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .login-card {
            background-color: #4a4850;
            padding: 40px;
            border-radius: 15px;
            width: 380px;
            color: white;
            text-align: center;
            border: 1px solid #5a5860;
        }

        .logo-login {
            width: 140px;
            margin-bottom: 25px;
        }

        .form-control {
            background-color: #5a5860;
            border: none;
            color: white;
        }

        .form-control:focus {
            background-color: #5a5860;
            color: white;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
        }

        .btn-login {
            background-color: #0d6efd;
            width: 100%;
            border: none;
            padding: 12px;
            font-weight: bold;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
        }

        .error-box {
            background-color: #dc3545;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <img src="{% static 'img/logo.png' %}" alt="Logo CAB" class="logo-login">
        <h2 class="h4 mb-4">Gestión CAB Systems</h2>

        {% if form.errors %}
            <div class="error-box">
                Usuario o contraseña incorrectos. Por favor verifica tus credenciales.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3 text-start">
                <label class="form-label small">Usuario</label>
                {{ form.username }}
            </div>

            <div class="mb-4 text-start">
                <label class="form-label small">Contraseña</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-login btn-primary">
                Ingresar
            </button>
        </form>
    </div>
</body>
</html>
